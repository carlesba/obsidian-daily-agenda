<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OG2iQvaFXz5L/NIWVYhiBu5ub2pXm3oMxAfjLqlQZbw='; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily Agenda</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
</style>
</head>
<body>
<h1>Returning to Obsidian</h1>
<p>Daily Agenda is finishing the sign-in in Obsidian. If Obsidian does not open, use the link below.</p>
<p><a id="open" href="obsidian://daily-agenda">Open Obsidian</a></p>
<p>You can close this page afterwards.</p>
<script>
(function () {
	var TARGET = "obsidian://daily-agenda";
	var FORWARDED = ["code", "state", "error"];
	var incoming = new URLSearchParams(location.search);
	var pairs = [];
	var state = incoming.get("state") || "";
	var dot = state.indexOf(".");
	if (dot !== -1) {
		try {
			var encoded = state.slice(dot + 1).replace(/-/g, "+").replace(/_/g, "/");
			var bytes = Uint8Array.from(atob(encoded), function (character) { return character.charCodeAt(0); });
			var vault = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
			if (vault !== "") pairs.push("vault=" + encodeURIComponent(vault));
		} catch (error) {}
	}
	FORWARDED.forEach(function (name) {
		var value = incoming.get(name);
		if (value !== null) pairs.push(name + "=" + encodeURIComponent(value));
	});
	var target = pairs.length === 0 ? TARGET : TARGET + "?" + pairs.join("&");
	document.getElementById("open").setAttribute("href", target);
	location.replace(target);
})();
</script>
</body>
</html>
